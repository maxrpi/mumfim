model traits:
  name: macro
  cases:
    - case name: thermal
      model traits:
        default geometry type: dimension id
        problem definition:
          macro:
            problem type:
              - name: problem type
                type: int
                value: 11
                geometry: ~
            material model:
              - category name: unit_conductivity
                continuum model:
                  fourier:
                    kappa:
                      - name: kappa
                        type: scalar
                        value: 1.0
                        geometry: [[3, 1], [3, 2], [3, 3]]
            convection:
              - category name: top
                parameters:
                  - name: magnitude
                    type: vector
                    value: [1.0, 2.0]
                    geometry: [[2, 14]]
            heat_flux:
              - category name: midtop
                flux:
                  - name: magnitude
                    type: scalar
                    value: 1.0e-0
                    geometry: [[2, 3]]
              - category name: midbottom
                flux:
                  - name: magnitude
                    type: scalar
                    value: 1.0e+3
                    geometry: [[2, 6]]
        solution strategy:
          macro:
            num timesteps:
              - name: num timesteps
                type: int
                value: 1
                geometry: ~
            load balancing:
              - name: load balancing
                type: int
                value: -2
                geometry: ~
        output:
          - category name: Results
            macro:
              results directory:
                - name: results
                  type: string
                  value: Results
                  geometry: ~
